apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stripe
  namespace: payments
spec:
  secretStoreRef:
    name: aws-sm
  target:
    name: stripe-keys
  data:
    - secretKey: STRIPE_API_KEY
      remoteRef:
        key: prod/payments/stripe
        property: api_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: prod/payments/stripe
        property: webhook_secret
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payments
  namespace: payments
spec:
  template:
    spec:
      containers:
        - name: payments
          image: ghcr.io/acme/payments:3.1.0
          env:
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-keys
                  key: STRIPE_API_KEY
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-keys
                  key: STRIPE_PUBLISHABLE_KEY
