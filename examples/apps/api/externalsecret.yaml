apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-db
  namespace: api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: api-db-credentials
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@db.internal:5432/api"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: apps/api/database
        property: username
    - secretKey: password
      remoteRef:
        key: apps/api/database
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-tls
  namespace: api
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: pki/api.example.com
        property: certificate
    - secretKey: tls.key
      remoteRef:
        key: pki/api.example.com
        property: private_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-session-key
  namespace: api
spec:
  refreshInterval: "0"
  target:
    name: api-session
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: strong-password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: api-session-backup
  namespace: api
spec:
  updatePolicy: Replace
  deletionPolicy: Delete
  secretStoreRefs:
    - kind: ClusterSecretStore
      labelSelector:
        matchLabels:
          backend: openbao
  selector:
    secret:
      name: api-session
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/api/session
          property: key
